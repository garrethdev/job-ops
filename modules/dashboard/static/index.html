<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>job-ops · lead dashboard</title>
<style>
  :root{
    --bg:#0f1216; --panel:#161b22; --panel2:#1c232d; --line:#2a333f;
    --txt:#e6edf3; --muted:#8b98a5; --accent:#4c8dff; --good:#3fb950;
    --warn:#d29922; --bad:#f85149; --chip:#21303f;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--txt)}
  header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel)}
  header h1{font-size:16px;margin:0;font-weight:650}
  .sub{color:var(--muted);font-size:12px}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--chip);color:var(--muted)}
  .pill.ok{color:var(--good)} .pill.no{color:var(--bad)}
  .toolbar{display:flex;gap:10px;align-items:center;padding:12px 20px;flex-wrap:wrap;
           border-bottom:1px solid var(--line);background:var(--panel)}
  .toolbar input,.toolbar select{background:var(--panel2);border:1px solid var(--line);
           color:var(--txt);border-radius:7px;padding:6px 9px;font-size:13px}
  .toolbar label{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}
  .spacer{flex:1}
  .count{color:var(--muted);font-size:12px}
  table{width:100%;border-collapse:collapse}
  th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:11px;
     text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 12px;
     border-bottom:1px solid var(--line)}
  td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:hover td{background:#141a21}
  .score{font-weight:700;font-size:15px;width:34px;text-align:center;border-radius:6px;
         padding:3px 0;display:inline-block}
  .s-hi{background:rgba(63,185,80,.16);color:var(--good)}
  .s-mid{background:rgba(210,153,34,.16);color:var(--warn)}
  .s-lo{background:rgba(139,152,165,.14);color:var(--muted)}
  .role{font-weight:600}
  .rationale{color:var(--muted);font-size:12px;margin-top:3px;max-width:340px}
  .lane{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--chip);white-space:nowrap}
  .company a,.contact a{color:var(--accent);text-decoration:none}
  .company a:hover,.contact a:hover{text-decoration:underline}
  .contact .nm{font-weight:600}
  .contact .tt{color:var(--muted);font-size:12px}
  .contact .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:3px;font-size:12px}
  .muted{color:var(--muted)}
  .flags{color:var(--warn);font-size:12px;margin-top:3px}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
       border-radius:7px;padding:5px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{border-color:var(--accent);color:#cfe0ff}
  .btn.bad:hover{border-color:var(--bad);color:var(--bad)}
  .btn:disabled{opacity:.5;cursor:default}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .notes textarea{width:240px;height:52px;background:var(--panel2);border:1px solid var(--line);
       color:var(--txt);border-radius:7px;padding:6px;font:12px/1.4 inherit;resize:vertical}
  .notes .disp{font-size:12px;color:var(--muted);max-width:220px;white-space:pre-wrap;cursor:text}
  #sources{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .src-head{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px}
  #src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
  .src{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
       border-radius:9px;padding:9px 11px}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
  .d-live{background:var(--good)} .d-needs-key{background:var(--accent)}
  .d-blocked{background:var(--bad)} .d-planned{background:var(--warn)}
  .src .nm{font-weight:600;font-size:13px}
  .src .kind{font-size:11px;color:var(--muted)}
  .src .note{font-size:11px;color:var(--muted);margin-top:2px}
  .src .cnt{margin-left:auto;font-weight:700;font-size:15px}
  .src .cnt .z{color:var(--muted);font-weight:400;font-size:12px}
  #toast{position:fixed;bottom:18px;right:18px;background:var(--panel2);border:1px solid var(--line);
       padding:10px 14px;border-radius:9px;font-size:13px;opacity:0;transform:translateY(8px);
       transition:.2s;pointer-events:none;max-width:340px}
  #toast.show{opacity:1;transform:none}
  .empty{padding:60px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>job-ops <span class="sub">· lead dashboard</span></h1>
  <span id="apollo" class="pill">apollo …</span>
  <span class="sub">Find LinkedIn = 1 Apollo credit · reveals LinkedIn + email together</span>
</header>

<div class="toolbar">
  <label>lane
    <select id="f-lane">
      <option value="">all</option>
      <option value="gtm-engineer">GTM Engineer</option>
      <option value="software-architect">Software Architect</option>
      <option value="ai-consultant">AI Consultant</option>
      <option value="ai-video-editor">AI Video Editor</option>
    </select>
  </label>
  <label>min fit <input id="f-min" type="number" min="0" max="10" value="0" style="width:56px"></label>
  <label><input id="f-enriched" type="checkbox"> only un-revealed</label>
  <input id="f-q" type="text" placeholder="search role / company…" style="min-width:220px">
  <div class="spacer"></div>
  <span class="count" id="count"></span>
  <button class="btn" id="src-btn" onclick="toggleSources()">📡 Sources</button>
  <button class="btn" onclick="load()">↻ refresh</button>
</div>

<div id="sources" hidden>
  <div class="src-head">Where roles come from <span class="muted" id="src-total"></span></div>
  <div id="src-grid"></div>
</div>

<table>
  <thead><tr>
    <th>Fit</th><th>Role</th><th>Company</th><th>Lane</th>
    <th>Contact</th><th>Notes</th><th>Actions</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<div id="empty" class="empty" hidden>No leads match. Seed the store: <code>python -m modules.web_checker --digest-out digest.md</code></div>
<div id="toast"></div>

<script>
let LEADS = [];
const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg, ms=2600){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),ms);}

async function load(){
  const r = await fetch("/api/leads"); const d = await r.json();
  LEADS = d.leads;
  const ap = $("#apollo");
  ap.textContent = d.apollo_ready ? "apollo ready" : "apollo: no key";
  ap.className = "pill " + (d.apollo_ready ? "ok":"no");
  render();
}
function scoreClass(s){return s>=8?"s-hi":s>=6?"s-mid":"s-lo";}
function laneLabel(l){return ({"gtm-engineer":"GTM Engineer","software-architect":"Software Architect",
  "ai-consultant":"AI Consultant","ai-video-editor":"AI Video Editor"}[l]||l||"—");}

function render(){
  const lane=$("#f-lane").value, min=+$("#f-min").value,
        onlyNew=$("#f-enriched").checked, q=$("#f-q").value.toLowerCase();
  const rows=$("#rows"); rows.innerHTML="";
  const list = LEADS.filter(x =>
    (!lane||x.lane===lane) && (x.fit_score>=min) &&
    (!onlyNew || !(x.contact&&x.contact.linkedin)) &&
    (!q || (x.title+" "+x.company).toLowerCase().includes(q)));
  $("#count").textContent = list.length+" / "+LEADS.length+" leads";
  $("#empty").hidden = list.length>0;
  for(const x of list) rows.appendChild(rowEl(x));
}

function rowEl(x){
  const tr=document.createElement("tr"); tr.dataset.id=x.id;
  const c=x.contact||{};
  const contactHtml = c.linkedin ? `
      <div class="nm">${esc(c.name)}</div>
      <div class="tt">${esc(c.title)}</div>
      <div class="row">
        ${c.linkedin?`<a href="${esc(c.linkedin)}" target="_blank">LinkedIn ↗</a>`:""}
        ${c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:'<span class="muted">no email</span>'}
      </div>` : `<span class="muted">—</span>`;
  const flags=(x.red_flags||[]).length?`<div class="flags">⚠ ${esc(x.red_flags.join("; "))}</div>`:"";
  tr.innerHTML = `
    <td><span class="score ${scoreClass(x.fit_score)}">${x.fit_score??"·"}</span></td>
    <td><div class="role">${esc(x.title)}</div>
        <div class="rationale">${esc(x.fit_rationale||"")}</div>${flags}</td>
    <td class="company">${x.url?`<a href="${esc(x.url)}" target="_blank">${esc(x.company)} ↗</a>`:esc(x.company)}
        <div class="muted" style="font-size:12px">${esc(x.location||"")}</div></td>
    <td><span class="lane">${laneLabel(x.lane)}</span></td>
    <td class="contact">${contactHtml}</td>
    <td class="notes"><div class="disp" title="click to edit">${esc(x.notes)|| '<span class="muted">+ note</span>'}</div></td>
    <td><div class="acts">
      <button class="btn primary act-li">${c.linkedin?"✓ LinkedIn":"🔗 Find LinkedIn"}</button>
      <button class="btn act-em">✉ Email</button>
      <button class="btn bad act-del">🗑</button>
    </div></td>`;
  tr.querySelector(".act-li").onclick = () => enrich(x.id, tr);
  tr.querySelector(".act-em").onclick = () => findEmail(x.id, tr);
  tr.querySelector(".act-del").onclick = () => del(x.id, tr);
  tr.querySelector(".notes .disp").onclick = e => editNotes(x, e.currentTarget);
  return tr;
}

async function enrich(id, tr){
  const lead = LEADS.find(l=>l.id===id);
  if(lead.contact && lead.contact.linkedin){ toast("Already revealed (no credit spent)."); return; }
  const btn=tr.querySelector(".act-li"); btn.disabled=true; btn.textContent="⏳ finding…";
  try{
    const r=await fetch(`/api/leads/${id}/enrich`,{method:"POST"});
    const d=await r.json();
    if(!r.ok){ toast("Error: "+(d.error||r.status)); btn.disabled=false; btn.textContent="🔗 Find LinkedIn"; return; }
    Object.assign(lead, d.lead);
    const cr=d.meta&&d.meta.credits_used||0;
    if(d.lead.contact && d.lead.contact.linkedin)
      toast(`Found ${d.lead.contact.name} · ${cr} credit${cr===1?"":"s"} used`);
    else toast(`No decision-maker found (${d.meta&&d.meta.reason||""}) · 0 credits`);
    tr.replaceWith(rowEl(lead));
  }catch(e){ toast("Request failed"); btn.disabled=false; btn.textContent="🔗 Find LinkedIn"; }
}
function findEmail(id, tr){
  const lead=LEADS.find(l=>l.id===id), c=lead.contact||{};
  if(c.email){ navigator.clipboard&&navigator.clipboard.writeText(c.email); toast("Email: "+c.email+" (copied)"); }
  else enrich(id, tr);   // one reveal gets both
}
async function del(id, tr){
  const lead=LEADS.find(l=>l.id===id);
  if(!confirm(`Delete lead:\n${lead.title} — ${lead.company}?`)) return;
  const r=await fetch(`/api/leads/${id}`,{method:"DELETE"});
  if(r.ok){ LEADS=LEADS.filter(l=>l.id!==id); tr.remove(); render(); toast("Deleted."); }
  else toast("Delete failed.");
}
function editNotes(x, disp){
  const td=disp.parentElement;
  td.innerHTML=`<textarea>${esc(x.notes)}</textarea><div style="margin-top:5px"><button class="btn primary">save</button> <button class="btn cancel">cancel</button></div>`;
  const ta=td.querySelector("textarea"); ta.focus();
  td.querySelector(".primary").onclick=async()=>{
    const r=await fetch(`/api/leads/${x.id}/notes`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({notes:ta.value})});
    const d=await r.json(); if(r.ok){ Object.assign(x,d.lead);
      const lead=LEADS.find(l=>l.id===x.id); if(lead) lead.notes=d.lead.notes; }
    td.innerHTML=`<div class="disp" title="click to edit">${esc(x.notes)||'<span class="muted">+ note</span>'}</div>`;
    td.querySelector(".disp").onclick=e=>editNotes(x,e.currentTarget); toast("Note saved.");
  };
  td.querySelector(".cancel").onclick=()=>{
    td.innerHTML=`<div class="disp" title="click to edit">${esc(x.notes)||'<span class="muted">+ note</span>'}</div>`;
    td.querySelector(".disp").onclick=e=>editNotes(x,e.currentTarget);
  };
}
let SRC_OPEN=false;
async function toggleSources(){
  SRC_OPEN=!SRC_OPEN;
  $("#sources").hidden=!SRC_OPEN;
  $("#src-btn").classList.toggle("primary",SRC_OPEN);
  if(!SRC_OPEN) return;
  const d=await (await fetch("/api/sources")).json();
  $("#src-total").textContent=`· ${d.total_leads} leads in store`;
  const order={live:0,"needs-key":1,blocked:2,planned:3};
  const label={live:"LIVE",["needs-key"]:"NEEDS KEY",blocked:"BLOCKED (email)",planned:"PLANNED"};
  d.sources.sort((a,b)=>(order[a.status]-order[b.status])||(b.count-a.count));
  const grid=$("#src-grid"); grid.innerHTML="";
  let cur=null;
  for(const s of d.sources){
    if(s.status!==cur){cur=s.status;
      const h=document.createElement("div");
      h.style.cssText="grid-column:1/-1;color:var(--muted);font-size:11px;margin:6px 0 2px;font-weight:600";
      h.textContent=label[s.status]||s.status; grid.appendChild(h);}
    const el=document.createElement("div"); el.className="src";
    el.innerHTML=`<span class="dot d-${s.status}"></span>
      <div><div class="nm">${esc(s.name)}</div>
        <div class="kind">${esc(s.kind)} · via ${esc(s.channel)}</div>
        <div class="note">${esc(s.note)}</div></div>
      <div class="cnt">${s.count>0?s.count:'<span class="z">0</span>'}</div>`;
    grid.appendChild(el);
  }
}
["#f-lane","#f-min","#f-enriched","#f-q"].forEach(s=>$(s).addEventListener("input",render));
load();
</script>
</body>
</html>
