# web-checker sources. One entry per board/marketplace.
# adapter  : which adapter module handles it (adapters/<adapter>.py)
# enabled  : set false to disable a source without deleting it
# source   : store 'source' value (board | marketplace)
# limit    : max records to pull per run (pre-filter cap)
# keywords : lane pre-filter — a fetched item must contain >=1 of these
#            substrings (case-insensitive) before it is scored/stored. Keeps
#            high-volume feeds (HN) from dumping unrelated jobs. Mirrors
#            ai-job-search's "pre-filter on snippets before fetching" rule.

sources:
  - name: remoteok
    adapter: remoteok
    enabled: true
    source: board
    limit: 60
    keywords:
      - engineer
      - architect
      - solutions
      - gtm
      - growth
      - consultant
      - ai
      - video
      - editor
      - platform

  - name: weworkremotely-programming
    adapter: weworkremotely
    enabled: true
    source: board
    limit: 40
    feeds:
      - "https://weworkremotely.com/categories/remote-programming-jobs.rss"
      - "https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss"
    keywords:
      - engineer
      - architect
      - solutions
      - gtm
      - growth
      - consultant
      - ai
      - video
      - editor
      - platform

  - name: hn-whoishiring
    adapter: hn_whoishiring
    enabled: true
    source: board
    limit: 50
    keywords:
      - remote
      - engineer
      - architect
      - solutions
      - gtm
      - growth
      - consultant
      - ai
      - video
      - editor

  # --- Firecrawl-backed (JS-rendered boards, structured extract) ---
  # Needs FIRECRAWL_API_KEY. Costs Firecrawl credits per board scrape.
  - name: himalayas
    adapter: firecrawl
    enabled: true
    source: board
    limit: 25
    url: "https://himalayas.app/jobs"
    keywords:
      - engineer
      - architect
      - solutions
      - gtm
      - growth
      - consultant
      - ai
      - video
      - editor
      - platform

  - name: remote-co
    adapter: firecrawl
    enabled: true
    source: board
    limit: 25
    url: "https://remote.co/remote-jobs/"
    keywords:
      - engineer
      - architect
      - solutions
      - gtm
      - growth
      - consultant
      - ai
      - video
      - editor
      - platform

  - name: gofractional
    adapter: firecrawl
    enabled: true
    source: marketplace
    limit: 30
    url: "https://www.gofractional.com/jobs"
    fetch_detail: true          # pull the full posting for kept roles (rich click-in)
    prompt: "Extract every fractional role/job listing on this page: the job title, the hiring company name, the location, and the absolute URL to the posting."
    keywords:
      - fractional
      - cto
      - cmo
      - coo
      - product
      - growth
      - marketing
      - revops
      - sales
      - gtm
      - ai
      - engineer
      - architect
      - ecommerce
      - e-commerce
      - consultant
      - operations

  - name: randstad-ai
    adapter: firecrawl
    enabled: true
    source: board
    limit: 30
    url: "https://www.randstadusa.com/jobs/q-ai/t-contract,temp-to-perm/"
    ignore_location: true       # judge on role-fit only; Garreth vets location himself
    fetch_detail: true          # pull the full posting for kept roles (rich click-in)
    prompt: "Extract every job listing on this page: the job title, the hiring company (employer) name, the location, and the absolute URL to the job posting detail page."
    keywords:
      - ai
      - ml
      - engineer
      - architect
      - developer
      - data
      - scientist
      - platform
      - solutions
      - consultant
      - gtm
      - growth
      - product

  - name: aijobs
    adapter: firecrawl
    enabled: true
    source: board
    limit: 12
    url: "https://aijobs.net/"
    company_from_detail: true   # employer hidden on the list page -> fetch from detail
    fetch_detail: true
    prompt: "Extract every job listing on this page: the job title, the location, and the absolute URL to the job posting detail page. The company name is usually NOT shown on the list — leave company blank if absent."
    keywords: [architect, consultant, applied, genai, "generative ai", llm, "machine learning", "solutions", staff, principal, platform, founding]

  - name: workatastartup
    adapter: firecrawl
    enabled: true
    source: board
    limit: 25
    url: "https://www.workatastartup.com/jobs"
    wait_for: 8000              # React SPA — needs render delay
    url_must_contain: "workatastartup.com/jobs/"
    fetch_detail: true
    keywords: [founding, staff, principal, architect, "applied ai", "machine learning", genai, llm, platform, infrastructure, "forward deployed", solutions, growth, gtm]

  - name: wellfound
    adapter: firecrawl
    enabled: true
    source: board
    limit: 25
    url: "https://wellfound.com/jobs"
    wait_for: 8000              # SPA + rate-limited; retry built into the adapter
    url_must_contain: "wellfound.com/jobs/"
    fetch_detail: true
    keywords: [gtm, growth, "solutions engineer", "sales engineer", "forward deployed", founding, architect, "applied ai", genai, llm, platform, consultant]

  - name: nextplay
    adapter: firecrawl
    enabled: true
    source: board
    limit: 25
    url: "https://nextplay.so/jobs"
    wait_for: 6000             # SPA
    no_url: true               # cards have NO real per-role link (only category pages) -> Find-LinkedIn instead
    keywords: [gtm, "forward deployed", founding, staff, principal, architect, "applied ai", genai, llm, platform, growth, solutions, "solutions engineer"]

# LinkedIn/Upwork route through email alerts (Module A), not naive scraping —
# see GAMEPLAN §3.  Remotive = separate API-based setup (not Firecrawl).
