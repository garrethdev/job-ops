name: email-scan (Module A)

# Module A — email-scanner. BLOCKED until Gmail OAuth for the gmail.com account
# (garreth.dottin@gmail.com / garrethdottin@gmail.com — NOT cryptomiami.net) is
# provisioned and stored as Actions secrets. See docs/SETUP.md.
#
# The daily cron is intentionally commented out so this does not run (and fail)
# before credentials exist. Uncomment the schedule once GMAIL_* secrets are set.

on:
  schedule:
    - cron: "30 11 * * *"   # daily, offset from web-check
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: email-scan
  cancel-in-progress: false

jobs:
  email-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Isolation guard
        run: python scripts/check_coupling.py

      - name: Preflight — required secrets present
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          missing=0
          for v in GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN; do
            if [ -z "${!v}" ]; then echo "MISSING secret: $v"; missing=1; fi
          done
          [ "$missing" = "0" ] || { echo "Module A is blocked on Gmail OAuth (docs/SETUP.md)"; exit 1; }

      - name: Run email-scanner
        id: run
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          # Email subjects are sparse -> LLM scoring is worth it (DeepSeek ~1c/run).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m modules.email_scanner --days 3 --llm --digest-out digest.md

      - name: Sync new leads to Supabase (dashboard)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/sync_to_supabase.py

      - name: Commit updated store
        continue-on-error: true   # store is cron state; Supabase is the dashboard's source of truth
        run: |
          git config user.name  "job-ops-bot"
          git config user.email "job-ops-bot@users.noreply.github.com"
          if git diff --quiet -- store/opportunities.jsonl; then
            echo "store unchanged, nothing to commit"; exit 0
          fi
          # Rebase our freshly-computed store onto the latest remote and retry, so a
          # remote moved by the other cron never fails the run ('[rejected] fetch first').
          branch="${GITHUB_REF_NAME:-main}"
          cp store/opportunities.jsonl "$RUNNER_TEMP/ours.jsonl"
          for i in 1 2 3 4 5; do
            git fetch origin "$branch" && git reset --hard "origin/$branch"
            cp "$RUNNER_TEMP/ours.jsonl" store/opportunities.jsonl
            if git diff --quiet -- store/opportunities.jsonl; then
              echo "store already current on remote"; exit 0
            fi
            git add store/opportunities.jsonl
            git commit -m "email-scan: update store ($(date -u +%Y-%m-%dT%H:%MZ))"
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            echo "push rejected (remote moved) — retry $i"; sleep $((i * 2))
          done
          echo "store push failed after retries (non-critical; leads are in Supabase)"

      - name: Open digest issue (only when there are new opportunities)
        if: steps.run.outputs.added != '0' && steps.run.outputs.added != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "${{ steps.run.outputs.digest_title }}" --body-file digest.md --label "digest,email-scan" || gh issue create --title "${{ steps.run.outputs.digest_title }}" --body-file digest.md

      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "email-scan FAILED — $(date -u +%Y-%m-%d)" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "could not open failure issue"
