name: web-check (Module B)

# Module B — web-checker. Daily cron. Fetches API/RSS sources, scores, dedupes,
# commits the updated store back to the repo, and opens a digest issue when there
# are new opportunities. Scoped secrets: ANTHROPIC (optional), FIRECRAWL (future).
# The state-commit at the end also keeps the repo "active" so free-runner crons
# are less likely to be skipped (GAMEPLAN §6).

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC ~= 7:00 ET daily
  workflow_dispatch: {}

# Least privilege: this workflow can write repo contents (the store) and issues.
permissions:
  contents: write
  issues: write

concurrency:
  group: web-check
  cancel-in-progress: false

jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Isolation guard (no cross-module imports)
        run: python scripts/check_coupling.py

      - name: Run web-checker
        id: run
        env:
          # DeepSeek (OpenRouter) is the scoring engine; Anthropic is fallback,
          # else free heuristic. Firecrawl powers the JS-rendered / gofractional sources.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python -m modules.web_checker --llm --digest-out digest.md

      - name: Sync new leads to Supabase (dashboard)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/sync_to_supabase.py

      - name: Commit updated store
        continue-on-error: true   # store is cron state; Supabase is the dashboard's source of truth
        run: |
          git config user.name  "job-ops-bot"
          git config user.email "job-ops-bot@users.noreply.github.com"
          if git diff --quiet -- store/opportunities.jsonl; then
            echo "store unchanged, nothing to commit"; exit 0
          fi
          # Another cron (or a manual push) may have moved the remote. Rebase our
          # freshly-computed store onto the latest remote and retry, so a moved
          # remote never fails the run ('! [rejected] main -> main (fetch first)').
          branch="${GITHUB_REF_NAME:-main}"
          cp store/opportunities.jsonl "$RUNNER_TEMP/ours.jsonl"
          for i in 1 2 3 4 5; do
            git fetch origin "$branch" && git reset --hard "origin/$branch"
            cp "$RUNNER_TEMP/ours.jsonl" store/opportunities.jsonl
            if git diff --quiet -- store/opportunities.jsonl; then
              echo "store already current on remote"; exit 0
            fi
            git add store/opportunities.jsonl
            git commit -m "web-check: update store ($(date -u +%Y-%m-%dT%H:%MZ))"
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            echo "push rejected (remote moved) — retry $i"; sleep $((i * 2))
          done
          echo "store push failed after retries (non-critical; leads are in Supabase)"

      - name: Open digest issue (only when there are new opportunities)
        if: steps.run.outputs.added != '0' && steps.run.outputs.added != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "${{ steps.run.outputs.digest_title }}" \
            --body-file digest.md \
            --label "digest,web-check" || \
          gh issue create \
            --title "${{ steps.run.outputs.digest_title }}" \
            --body-file digest.md

      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "web-check FAILED — $(date -u +%Y-%m-%d)" \
            --body "The web-check workflow failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "could not open failure issue"
