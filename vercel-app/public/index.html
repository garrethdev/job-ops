<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>job-ops · leads</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- Password gate -->
<div id="gate" class="gate" hidden>
  <div class="gate__card">
    <div class="gate__brand">job-ops</div>
    <p class="gate__hint">Enter the dashboard password.</p>
    <input id="pw" class="gate__input" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn btn--primary btn--block" onclick="submitPw()">Unlock</button>
    <div id="pwerr" class="gate__err"></div>
  </div>
</div>

<!-- Header -->
<header class="topbar">
  <div class="topbar__brand">job-ops <span class="topbar__sub">leads</span></div>
  <span id="apollo" class="badge">apollo …</span>
  <span class="topbar__note">Find LinkedIn = 1 Apollo credit · reveals LinkedIn + email</span>
</header>

<!-- Find a contact -->
<div class="finder">
  <span class="finder__label">Find a contact</span>
  <input id="find-company" class="input" type="text" placeholder="Company (required)">
  <input id="find-role" class="input" type="text" placeholder="Role / title (optional)">
  <select id="find-lane" class="input">
    <option value="">Auto (leadership)</option>
    <option value="ai-consultant">AI Consultant</option>
    <option value="software-architect">Software Architect</option>
    <option value="gtm-engineer">GTM Engineer</option>
    <option value="ai-video-editor">AI Video Editor</option>
  </select>
  <button id="find-btn" class="btn btn--primary" onclick="findContactSearch()">Find contact</button>
  <span id="find-status" class="finder__status"></span>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <label class="field">Lane
    <select id="f-lane" class="input">
      <option value="">All</option>
      <option value="ai-consultant">AI Consultant</option>
      <option value="software-architect">Software Architect</option>
      <option value="gtm-engineer">GTM Engineer</option>
      <option value="ai-video-editor">AI Video Editor</option>
      <option value="product-lead">Product Lead</option>
      <option value="marketing-lead">Marketing Lead</option>
      <option value="lookup">Contact lookup</option>
    </select>
  </label>
  <label class="field">Min fit
    <input id="f-min" class="input input--num" type="number" min="0" max="10" value="0">
  </label>
  <label class="field field--check">
    <input id="f-enriched" type="checkbox"> Only un-revealed
  </label>
  <input id="f-q" class="input input--search" type="text" placeholder="Search role or company…">
  <div class="toolbar__spacer"></div>
  <span id="count" class="toolbar__count"></span>
  <button class="btn" onclick="load()">Refresh</button>
  <button class="btn" onclick="logout()">Lock</button>
</div>

<!-- Table -->
<div class="table-wrap">
  <table class="leads">
    <thead>
      <tr>
        <th class="col-fit">Fit</th>
        <th>Role</th>
        <th>Company</th>
        <th>Lane</th>
        <th>Contact</th>
        <th>Notes</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<div id="empty" class="empty" hidden>No leads match.</div>

<div id="toast" class="toast"></div>

<script src="/app.js"></script>
</body>
</html>
