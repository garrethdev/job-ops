[project]
name = "job-ops"
version = "0.1.0"
description = "Scheduled jobs surfacing opportunities across two lanes (software architecture + video AI editing), enriching them with contacts, feeding an apply pipeline."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
# Repo root on sys.path (conftest.py also handles this) so `import core` works.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

# NOTE: CI targets Python 3.11. The code is intentionally kept 3.9-compatible
# (uses `from __future__ import annotations`, no match statements) so it can be
# run and tested on older local interpreters.
